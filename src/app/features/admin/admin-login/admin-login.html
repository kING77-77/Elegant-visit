<div class="login-wrapper">
  <div class="glow-bg"></div>
  <div class="login-card glass-panel animate-slide-up">
    <div class="login-header">
      <div class="brand-icon">
        <i class="fa-solid fa-lock-open"></i>
      </div>
      <h1 class="login-title">Панель управления</h1>
      <p class="login-subtitle">Вход для администратора RSVP сервиса</p>
    </div>

    @if (errorMsg()) {
      <div class="error-alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ errorMsg() }}</span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Имя пользователя</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user input-icon"></i>
          <input 
            id="username" 
            type="text" 
            formControlName="username" 
            class="form-input" 
            placeholder="admin"
            [class.invalid]="hasError('username', 'required')"
          >
        </div>
        @if (hasError('username', 'required')) {
          <span class="form-error">Укажите имя пользователя</span>
        }
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Пароль</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-key input-icon"></i>
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            class="form-input" 
            placeholder="••••••••"
            [class.invalid]="hasError('password', 'required')"
          >
        </div>
        @if (hasError('password', 'required')) {
          <span class="form-error">Укажите пароль</span>
        }
      </div>

      <button type="submit" class="btn-gold" [disabled]="submitting()">
        @if (submitting()) {
          <div class="spinner spinner-white"></div> Вход...
        } @else {
          Войти в панель <i class="fa-solid fa-right-to-bracket"></i>
        }
      </button>
    </form>

    <div class="login-footer">
      <a routerLink="/" class="back-link"><i class="fa-solid fa-arrow-left-long"></i> На главную страницу</a>
    </div>
  </div>
</div>
